name: AI Team - GPT4 + Claude
on:
  issues:
    types: [opened, edited]
  workflow_dispatch:  # Cho phép chạy thủ công

jobs:
  gpt-claude-team:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          pip install openai anthropic PyGithub
      
      - name: Generate Code with GPT-4
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python << 'EOF'
          import os
          from openai import OpenAI
          
          # GPT-4 viết code từ issue
          client = OpenAI(api_key=os.environ['OPENAI_API_KEY'])
          
          issue_text = f"""
          Hãy viết code giải quyết vấn đề sau:
          
          Title: {os.environ['ISSUE_TITLE']}
          Description: {os.environ['ISSUE_BODY']}
          
          Yêu cầu:
          1. Code sạch, có comment
          2. Xử lý lỗi đầy đủ
          3. Tối ưu performance
          """
          
          response = client.chat.completions.create(
              model="gpt-4-turbo-preview",
              messages=[
                  {"role": "system", "content": "You are a senior software engineer. Write production-ready code."},
                  {"role": "user", "content": issue_text}
              ],
              temperature=0.7,
              max_tokens=4000
          )
          
          gpt_code = response.choices[0].message.content
          
          # Lưu code
          with open('gpt_solution.py', 'w') as f:
              f.write(gpt_code)
          
          print("✅ GPT-4 generated code!")
          print(f"Code length: {len(gpt_code)} characters")
          EOF
      
      - name: Review & Improve with Claude
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
        run: |
          python << 'EOF'
          import os
          import anthropic
          
          # Đọc code từ GPT-4
          with open('gpt_solution.py', 'r') as f:
              gpt_code = f.read()
          
          # Claude review và cải thiện
          client = anthropic.Anthropic(api_key=os.environ['CLAUDE_API_KEY'])
          
          response = client.messages.create(
              model="claude-3-opus-20240229",
              max_tokens=4000,
              messages=[
                  {
                      "role": "user",
                      "content": f"""
                      Hãy review và cải thiện code sau từ GPT-4:
                      
                      {gpt_code}
                      
                      Yêu cầu:
                      1. Tìm và sửa bugs
                      2. Cải thiện performance
                      3. Thêm error handling nếu thiếu
                      4. Tối ưu code structure
                      5. Giữ nguyên chức năng chính
                      
                      Trả về code hoàn chỉnh đã được cải thiện.
                      """
                  }
              ]
          )
          
          final_code = response.content[0].text
          
          # Lưu code final
          with open('final_solution.py', 'w') as f:
              f.write(final_code)
          
          # Tạo summary
          with open('ai_summary.md', 'w') as f:
              f.write(f"""## 🤖 AI Team Summary
              
### Process:
1. **GPT-4** generated initial solution
2. **Claude** reviewed and improved the code

### Files:
- `gpt_solution.py` - Original GPT-4 code
- `final_solution.py` - Claude improved version

### Changes made by Claude:
- Bug fixes
- Performance improvements
- Code structure optimization
""")
          
          print("✅ Claude reviewed and improved code!")
          EOF
      
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          commit-message: "🤖 AI Team: GPT-4 + Claude solution for issue #${{ github.event.issue.number }}"
          branch: ai-solution-${{ github.event.issue.number }}
          title: "🤖 AI Team Solution: ${{ github.event.issue.title }}"
          body: |
            ## 🤖 Dual AI Generated Solution
            
            **Team**: GPT-4 + Claude
            
            ### Workflow:
            1. GPT-4 phân tích issue và viết code
            2. Claude review và cải thiện code
            
            ### Files:
            - `gpt_solution.py` - Code gốc từ GPT-4
            - `final_solution.py` - Code cuối cùng sau khi Claude cải thiện
            
            Fixes #${{ github.event.issue.number }}
          labels: ai-generated
      
      - name: Comment on Issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python << 'EOF'
          import os
          from github import Github
          
          gh = Github(os.environ['GITHUB_TOKEN'])
          repo = gh.get_repo(os.environ['GITHUB_REPOSITORY'])
          issue = repo.get_issue(number=int(os.environ['GITHUB_EVENT_ISSUE_NUMBER']))
          
          issue.create_comment("""
          ## 🤖 AI Team đang xử lý!
          
          - ✅ GPT-4 đã tạo code
          - ✅ Claude đã review và cải thiện
          - 🔄 Đang tạo Pull Request...
          
          Vui lòng chờ trong giây lát!
          """)
          EOF
