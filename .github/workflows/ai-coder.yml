name: AI Coder - Gemini Free
on:
  issues:
    types: [opened, edited]

jobs:
  ai-handler:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install google-genai PyGithub
      
      - name: AI Xử Lý Issue với Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          python << 'EOF'
          import os, sys
          from google import genai
          from github import Github
          
          print("=" * 50)
          print("🚀 Bắt đầu xử lý với Gemini...")
          print("=" * 50)
          
          # Đọc thông tin issue
          title = os.environ.get('ISSUE_TITLE', '')
          body = os.environ.get('ISSUE_BODY', '')
          issue_num = os.environ.get('ISSUE_NUMBER', '1')
          
          print(f"📝 Issue #{issue_num}: {title}")
          
          # Kiểm tra API key
          if not os.environ.get('GEMINI_API_KEY'):
              print("❌ Thiếu GEMINI_API_KEY")
              sys.exit(1)
          
          print("✅ Gemini API key OK")
          
          # Xác định loại yêu cầu
          is_bug = any(word in (title + body).lower() 
                      for word in ['bug', 'lỗi', 'fix', 'sửa', 'error', 'sai', 'trắng'])
          
          print(f"📝 Loại: {'🐛 Bug Fix' if is_bug else '✨ New Code'}")
          
          # Gemini xử lý
          try:
              client = genai.Client(api_key=os.environ['GEMINI_API_KEY'])
              
              if is_bug:
                  prompt = f"""
                  Bạn là senior developer. Hãy fix bug sau:
                  
                  Title: {title}
                  Description: {body}
                  
                  Hãy:
                  1. Phân tích nguyên nhân bug
                  2. Viết code fix hoàn chỉnh (chỉ code, không giải thích dài dòng)
                  3. Code phải chạy được ngay
                  """
              else:
                  prompt = f"""
                  Bạn là senior developer. Hãy viết code cho yêu cầu sau:
                  
                  Title: {title}
                  Description: {body}
                  
                  Hãy:
                  1. Viết code hoàn chỉnh (chỉ code, không giải thích dài dòng)
                  2. Có comment giải thích
                  3. Xử lý các edge cases
                  """
              
              print("🤖 Gemini đang xử lý...")
              
              response = client.models.generate_content(
                  model="gemini-2.0-flash",
                  contents=prompt
              )
              
              final_code = response.text
              
              # Clean code nếu Gemini wrap trong ```
              if "```" in final_code:
                  parts = final_code.split("```")
                  if len(parts) >= 2:
                      final_code = parts[1]
                      if "\n" in final_code:
                          final_code = final_code.split("\n", 1)[1]
              
              print("✅ Gemini hoàn thành")
              print(f"📏 Code length: {len(final_code)} characters")
              
          except Exception as e:
              print(f"❌ Lỗi Gemini: {e}")
              print("🔍 Thử model khác...")
              
              # Fallback: thử model cũ hơn
              try:
                  response = client.models.generate_content(
                      model="gemini-1.5-flash",
                      contents=prompt
                  )
                  final_code = response.text
                  
                  if "```" in final_code:
                      parts = final_code.split("```")
                      if len(parts) >= 2:
                          final_code = parts[1]
                          if "\n" in final_code:
                              final_code = final_code.split("\n", 1)[1]
                  
                  print("✅ Dùng model fallback thành công")
              except Exception as e2:
                  print(f"❌ Lỗi fallback: {e2}")
                  sys.exit(1)
          
          # Tạo PR
          try:
              gh = Github(os.environ['GITHUB_TOKEN'])
              repo = gh.get_repo(os.environ['GITHUB_REPOSITORY'])
              
              # Tự detect branch chính
              try:
                  main_branch = repo.get_branch("main")
                  base_branch = "main"
              except:
                  main_branch = repo.get_branch("master")
                  base_branch = "master"
              
              print(f"📦 Branch chính: {base_branch}")
              
              # Tạo branch mới
              branch_name = f"ai-fix-{issue_num}"
              
              try:
                  repo.create_git_ref(f"refs/heads/{branch_name}", main_branch.commit.sha)
                  print(f"✅ Tạo branch: {branch_name}")
              except:
                  print("⚠️ Branch đã tồn tại, xóa và tạo lại...")
                  try:
                      repo.get_git_ref(f"heads/{branch_name}").delete()
                  except:
                      pass
                  repo.create_git_ref(f"refs/heads/{branch_name}", main_branch.commit.sha)
              
              # Lưu file
              filename = f"solution_{issue_num}.py"
              
              try:
                  try:
                      old_file = repo.get_contents(filename, ref=branch_name)
                      repo.update_file(
                          path=filename,
                          message=f"AI fix issue #{issue_num}",
                          content=final_code,
                          sha=old_file.sha,
                          branch=branch_name
                      )
                      print(f"✅ Update file: {filename}")
                  except:
                      repo.create_file(
                          path=filename,
                          message=f"AI fix issue #{issue_num}",
                          content=final_code,
                          branch=branch_name
                      )
                      print(f"✅ Tạo file: {filename}")
              except Exception as e:
                  print(f"⚠️ Lỗi commit file: {e}")
              
              # Tạo PR
              pr = repo.create_pull(
                  title=f"🤖 AI {'Fix' if is_bug else 'Code'}: {title}",
                  body=f"""
                  ## 🤖 AI Generated {'Fix' if is_bug else 'Code'}
                  
                  **Loại**: {'🐛 Fix Bug' if is_bug else '✨ Viết Code Mới'}
                  
                  ### Process:
                  1. Gemini phân tích và xử lý
                  
                  ### File:
                  - `{filename}`
                  
                  Fixes #{issue_num}
                  """,
                  head=branch_name,
                  base=base_branch
              )
              
              print(f"✅ Tạo PR thành công: #{pr.number}")
              
              # Comment lên issue
              issue = repo.get_issue(number=int(issue_num))
              issue.create_comment(f"""
              ## ✅ AI đã xử lý xong!
              
              {'🐛 **Bug đã được fix**' if is_bug else '✨ **Code đã được viết**'}
              
              ### Process:
              1. ✅ Gemini phân tích và xử lý
              2. ✅ Tạo Pull Request: PR #{pr.number}
              
              Xem code tại: {pr.html_url}
              """)
              
              print("=" * 50)
              print("✅ HOÀN THÀNH!")
              print("=" * 50)
              
          except Exception as e:
              print(f"❌ Lỗi tạo PR: {e}")
              sys.exit(1)
          EOF
