<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="dmca-site-verification"

    />

    <title>NXX315 Studio Rewards — Kiếm Coin, đổi Robux chính hãng</title>

    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#3478F6" />

    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #f8fafc;
      }

      /* ===== SPLASH (nằm NGOÀI #root) ===== */
      #app-splash {
        position: fixed;
        inset: 0;
        background: #f8fafc;
        z-index: 9999;
        padding: 20px 16px;
        box-sizing: border-box;
        opacity: 1;
        transition: opacity 0.55s ease, transform 0.55s ease;
        will-change: opacity, transform;
      }

      #app-splash.app-splash--hide {
        opacity: 0;
        transform: scale(1.02);
        pointer-events: none;
      }

      #app-splash .app-splash__inner {
        max-width: 480px;
        margin: 0 auto;
        animation: app-splash-enter 0.4s ease both;
      }

      @keyframes app-splash-enter {
        from { opacity: 0; transform: translateY(8px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      /* ===== SKELETON + SHIMMER ===== */
      .app-skel {
        position: relative;
        overflow: hidden;
        background: #e2e8f0;
        border-radius: 12px;
        animation: app-skel-pulse 1.6s ease-in-out infinite;
      }

      .app-skel::after {
        content: "";
        position: absolute;
        inset: 0;
        transform: translateX(-100%);
        background: linear-gradient(
          100deg,
          rgba(255, 255, 255, 0) 20%,
          rgba(255, 255, 255, 0.75) 50%,
          rgba(255, 255, 255, 0) 80%
        );
        animation: app-skel-shimmer 1.6s infinite;
      }

      @keyframes app-skel-pulse {
        0%, 100% { opacity: 1; }
        50%      { opacity: 0.55; }
      }

      @keyframes app-skel-shimmer {
        100% { transform: translateX(100%); }
      }

      .app-splash__brand {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 20px;
      }

      .app-splash__logo {
        width: 32px;
        height: 32px;
        border-radius: 10px;
        background: linear-gradient(135deg, #3478F6, #7aa8ff);
        box-shadow: 0 4px 14px rgba(52, 120, 246, 0.35);
        flex: 0 0 auto;
      }

      .app-splash__name {
        height: 16px;
        width: 120px;
        border-radius: 8px;
        background: #e2e8f0;
        position: relative;
        overflow: hidden;
        animation: app-skel-pulse 1.6s ease-in-out infinite;
      }

      .app-splash__name::after {
        content: "";
        position: absolute;
        inset: 0;
        transform: translateX(-100%);
        background: linear-gradient(
          100deg,
          rgba(255, 255, 255, 0) 20%,
          rgba(255, 255, 255, 0.75) 50%,
          rgba(255, 255, 255, 0) 80%
        );
        animation: app-skel-shimmer 1.6s infinite;
      }

      /* ===== #root: KHÔNG ẩn opacity nữa ===== */
      /* Nếu muốn fade-in thì chỉ fade khi đã có nội dung thật */
      #root {
        min-height: 100vh;
      }
    </style>
  </head>

  <body>
    <!-- SPLASH: đặt NGOÀI #root, ngang cấp với nó -->
    <div id="app-splash">
      <div class="app-splash__inner">
        <div class="app-splash__brand">
          <div class="app-splash__logo"></div>
          <div class="app-splash__name"></div>
        </div>

        <div class="app-skel" style="height:110px;border-radius:20px;margin-bottom:16px;"></div>
        <div class="app-skel" style="height:90px;border-radius:16px;margin-bottom:12px;"></div>
        <div class="app-skel" style="height:90px;border-radius:16px;margin-bottom:12px;"></div>
        <div class="app-skel" style="height:90px;border-radius:16px;"></div>
      </div>
    </div>

    <!-- React root: rỗng, React sẽ render vào đây -->
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>

    <script>
      (function () {
        const splash = document.getElementById("app-splash");
        const root = document.getElementById("root");

        const MIN_SPLASH_TIME = 700;
        const MAX_SPLASH_TIME = 6000;
        const start = Date.now();
        let finished = false;

        function hideSplash() {
          if (finished) return;
          finished = true;

          const elapsed = Date.now() - start;
          const wait = Math.max(0, MIN_SPLASH_TIME - elapsed);

          setTimeout(() => {
            splash.classList.add("app-splash--hide");
            setTimeout(() => splash.remove(), 600);
          }, wait);
        }

        // Khi React render xong => #root có con
        const observer = new MutationObserver(() => {
          if (root.children.length > 0) hideSplash();
        });
        observer.observe(root, { childList: true });

        // Fallback an toàn
        setTimeout(hideSplash, MAX_SPLASH_TIME);
      })();

      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/sw.js").catch((err) => {
            console.error("SW registration failed:", err);
          });
        });
      }
    </script>
  </body>
</html>
