<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0068FF" />
    <title>NXX315 Studio Rewards</title>

    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }

      #initial-loader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #ffffff;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        transition: opacity 0.5s ease;
      }

      #initial-loader.hide {
        opacity: 0;
        pointer-events: none;
      }

      /* ==== LOGO — CHỮ BÉ ==== */
      .loader-logo {
        font-size: 22px;
        font-weight: 800;
        letter-spacing: -0.5px;
        margin-bottom: 28px;
        display: flex;
        align-items: baseline;
        gap: 6px;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }

      .loader-logo .part-dark {
        color: #0f172a;
      }

      .loader-logo .part-blue {
        color: #38bdf8;
      }

      /* ==== 2 CỤC DI CHUYỂN ==== */
      .loader-balls {
        position: relative;
        width: 80px;
        height: 14px;
      }

      .ball {
        position: absolute;
        top: 50%;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        margin-top: -6px;
      }

      .ball-blue {
        left: 0;
        background: #0068FF;
        box-shadow: 0 3px 10px rgba(0, 104, 255, 0.35);
        animation: ball-blue-move 1.4s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }

      .ball-green {
        right: 0;
        background: #38bdf8;
        box-shadow: 0 3px 10px rgba(56, 189, 248, 0.35);
        animation: ball-green-move 1.4s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }

      @keyframes ball-blue-move {
        0%, 100% { transform: translateX(0); }
        50% { transform: translateX(68px); }
      }

      @keyframes ball-green-move {
        0%, 100% { transform: translateX(0); }
        50% { transform: translateX(-68px); }
      }

      /* ==== TEXT ==== */
      .loader-hint {
        font-size: 11px;
        color: #94a3b8;
        margin-top: 24px;
        font-weight: 500;
        letter-spacing: 0.3px;
      }
    </style>

    <!-- Phông chữ Be Vietnam Pro (phải nằm NGOÀI thẻ style) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;700;800;900&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div id="root"></div>

    <div id="initial-loader">
      <div class="loader-logo">
        <span class="part-dark">NXX315</span>
        <span class="part-blue">Studio</span>
      </div>

      <div class="loader-balls">
        <div class="ball ball-blue"></div>
        <div class="ball ball-green"></div>
      </div>

      <p class="loader-hint">Đang tải...</p>
    </div>

    <script type="module" src="/src/main.jsx"></script>

    <script>
      (function () {
        var loader = document.getElementById("initial-loader");
        if (!loader) return;
        var hidden = false;

        function hideLoader() {
          if (hidden) return;
          hidden = true;
          loader.classList.add("hide");
          setTimeout(function () {
            loader.style.display = "none";
          }, 500);
        }

        var rootEl = document.getElementById("root");
        if (rootEl) {
          var observer = new MutationObserver(function () {
            if (rootEl.children.length > 0) {
              setTimeout(hideLoader, 250);
              observer.disconnect();
            }
          });
          observer.observe(rootEl, { childList: true, subtree: true });
        }

        setTimeout(hideLoader, 12000);
      })();
    </script>
  </body>
</html>
