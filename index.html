<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0068FF" />
    <title>NXX315 Studio Rewards</title>

    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }

      /* ========== LOADER ========== */
      #initial-loader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #ffffff;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        transition: opacity 0.5s ease;
      }

      #initial-loader.hide {
        opacity: 0;
        pointer-events: none;
      }

      /* ==== LOGO TEXT ==== */
      .loader-logo {
        font-size: 42px;
        font-weight: 900;
        letter-spacing: -1.5px;
        margin-bottom: 40px;
        display: flex;
        align-items: baseline;
        gap: 2px;
        animation: logo-fade 2s ease-in-out infinite;
      }

      @keyframes logo-fade {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.75; }
      }

      .loader-logo .part-1 {
        color: #0068FF; /* Xanh dương */
      }

      .loader-logo .part-2 {
        color: #00D26A; /* Xanh lá */
      }

      /* ==== 2 CỤC DI CHUYỂN QUA LẠI ==== */
      .loader-balls {
        position: relative;
        width: 90px;
        height: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
      }

      .ball {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        position: absolute;
      }

      .ball-blue {
        background: #0068FF;
        box-shadow: 0 4px 16px rgba(0, 104, 255, 0.4);
        animation: ball-left 1.4s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }

      .ball-green {
        background: #00D26A;
        box-shadow: 0 4px 16px rgba(0, 210, 106, 0.4);
        animation: ball-right 1.4s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }

      /* Cục xanh dương di chuyển từ trái → phải → trái */
      @keyframes ball-left {
        0% {
          left: 0%;
          transform: translateX(0);
        }
        50% {
          left: 50%;
          transform: translateX(-50%);
        }
        100% {
          left: 100%;
          transform: translateX(-100%);
        }
      }

      /* Cục xanh lá di chuyển ngược lại */
      @keyframes ball-right {
        0% {
          left: 100%;
          transform: translateX(-100%);
        }
        50% {
          left: 50%;
          transform: translateX(-50%);
        }
        100% {
          left: 0%;
          transform: translateX(0);
        }
      }

      /* ==== FALLBACK TEXT (nếu cần) ==== */
      .loader-hint {
        font-size: 12px;
        color: #94a3b8;
        margin-top: 32px;
        font-weight: 500;
        letter-spacing: 0.3px;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>

    <!-- ========== LOADING SCREEN ========== -->
    <div id="initial-loader">
      <!-- Logo text -->
      <div class="loader-logo">
        <span class="part-1">NXX</span>
        <span class="part-2">315</span>
      </div>

      <!-- 2 cục di chuyển -->
      <div class="loader-balls">
        <div class="ball ball-blue"></div>
        <div class="ball ball-green"></div>
      </div>

      <p class="loader-hint">Đang tải...</p>
    </div>

    <script type="module" src="/src/main.jsx"></script>

    <script>
      (function () {
        var loader = document.getElementById("initial-loader");
        if (!loader) return;
        var hidden = false;

        function hideLoader() {
          if (hidden) return;
          hidden = true;
          loader.classList.add("hide");
          setTimeout(function () {
            loader.style.display = "none";
          }, 500);
        }

        var rootEl = document.getElementById("root");
        if (rootEl) {
          var observer = new MutationObserver(function () {
            if (rootEl.children.length > 0) {
              setTimeout(hideLoader, 250);
              observer.disconnect();
            }
          });
          observer.observe(rootEl, { childList: true, subtree: true });
        }

        setTimeout(hideLoader, 3000);
      })();
    </script>
  </body>
</html>
